<!DOCTYPE html>
<html>
<head>
    <title>Merkle Tree Visualizer</title>
    <style>
body {
    background: white;
    color: black;
    font-family: Arial;
    text-align: center;
}

.tree {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
    gap: 10px;
}

.level {
    display: flex;
    justify-content: center;
    margin: 20px 0;  
}

.node {
    border: 2px solid black;
    padding: 10px 15px;
    margin: 10px;   
    border-radius: 8px;
    background: #f5f5f5;
    font-weight: bold;
    min-width: 60px;   
}
.level:first-child {
    margin-bottom: 30px;
}

.node.diff {
    border: 2px solid red;
    color: red;
    background: #ffe6e6;
}
.level-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.lines {
    width: 100%;
    height: 40px;
}
</style>
</head>
<body>

<h2>Merkle Tree Visualizer</h2>

<h3>Quick Insert Data</h3>

<input id="quickA" placeholder="Dataset A (A,B,C,D)">
<br><br>
<input id="quickB" placeholder="Dataset B (A,B,X,D)">
<br><br>

<button onclick="quickInsert()">Insert & Generate</button>

<hr>

<button onclick="generate()">Generate Tree</button>
<button onclick="syncData()">Sync Dataset 2 → Dataset 1</button>
<button onclick="deleteLogs()">Delete Logs</button>


<h3>DATASET 1</h3>
<p id="values1"></p>
<div id="network1" style="height:400px;"></div>

<h3>DATASET 2</h3>
<p id="values2"></p>
<div id="network2" style="height:400px;"></div>

<h3 id="result"></h3>
<h3>SYNC LOG</h3>
<div id="logs"></div>

<!-- vis-network CDN -->
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script>
let lastResponse = null;
let lastData1 = [];
let lastData2 = [];

function isDifferent(data, level, index) {
    const hash1 = data.levels[level][index]?.hash;
    const hash2 = window.compareData.levels[level][index]?.hash;

    return hash1 !== hash2;
}

function buildGraph(data, differences) {
    let nodes = [];
    let edges = [];
    let id = 1;

    let currentLevel = [];

    data.leaves.forEach((leaf, idx) => {
        const nodeId = id++;

    nodes.push({
        id: nodeId,
        label: leaf.hash.substring(0,6),
        color: differences.includes(idx) ? 'red' : '#97C2FC',
        level: data.levels.length + 1  
    });

        currentLevel.push(nodeId);
    });

    for (let level = 0; level < data.levels.length; level++) {
        let nextLevel = [];

        for (let i = 0; i < currentLevel.length; i += 2) {
            const left = currentLevel[i];
            const right = currentLevel[i + 1] || left;

            const nodeData = data.levels[level][Math.floor(i / 2)];
            const nodeId = id++;

            const isDiff =
                nodeData.hash !== window.compareData.levels[level][Math.floor(i / 2)]?.hash;

            nodes.push({
                id: nodeId,
                label: nodeData.hash.substring(0,6),
                color: isDiff ? 'red' : '#97C2FC',
                level: data.levels.length - level   
            });

            edges.push({ from: nodeId, to: left });
            edges.push({ from: nodeId, to: right });

            nextLevel.push(nodeId);
        }

        currentLevel = nextLevel;
    }

    return { nodes, edges };
}

function draw(containerId, data, differences) {
    const { nodes, edges } = buildGraph(data, differences);

    const container = document.getElementById(containerId);

    new vis.Network(container, {
        nodes: new vis.DataSet(nodes),
        edges: new vis.DataSet(edges)
    }, {
        layout: {
            hierarchical: {
                direction: "UD",
                levelSeparation: 120,
                nodeSpacing: 150,
                sortMethod: "directed"
            }
        },
        physics: false,

        interaction: {
            dragNodes: false,    
            dragView: false,      
            zoomView: false,
            selectable: false     
        }
    });
}

async function generate() {
    const res = await fetch('/api/merkle-compare', {
        method: 'POST'
    });

    const data = await res.json();

    // 🔥 SHOW VALUES
    document.getElementById("values1").innerText =
        "Values: " + data.dataset1.leaves.map(l => l.data).join(", ");

    document.getElementById("values2").innerText =
        "Values: " + data.dataset2.leaves.map(l => l.data).join(", ");

    // draw trees
    window.compareData = data.dataset2;
    draw("network1", data.dataset1, data.differences);

    window.compareData = data.dataset1;
    draw("network2", data.dataset2, data.differences);

    document.getElementById("result").innerText =
        "ROOT EQUAL: " + data.rootComparison.isEqual;

    lastResponse = data;  
}

async function syncData() {
    const res = await fetch('/api/sync-db', {
        method: 'POST'
    });

    const data = await res.json();

    alert("Sync completed!");

    
    generate();
    loadLogs();
}

async function loadLogs() {
    const res = await fetch('/api/sync-logs');
    const logs = await res.json();

    let html = "";

    logs.forEach(log => {
        html += `
            <div style="border:1px solid #ccc; padding:10px; margin:10px;">
                <b>Time:</b> ${new Date(log.timestamp).toLocaleString()}<br>
                <b>Updated Indexes:</b> ${log.updatedIndexes}<br>
                <b>Before:</b> ${log.before.join(', ')}<br>
                <b>After:</b> ${log.after.join(', ')}
            </div>
        `;
    });

    document.getElementById("logs").innerHTML = html;
}

async function deleteLogs() {
    const res = await fetch('/api/sync-logs', {
        method: 'DELETE'
    });

    const data = await res.json();

    alert("Logs deleted!");

    // clear UI
    document.getElementById("logs").innerHTML = "";
}

async function quickInsert() {
    const dataA = document.getElementById('quickA').value.split(',');
    const dataB = document.getElementById('quickB').value.split(',');

    // insert dataset A
    await fetch('/api/insert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            datasetName: "A",
            values: dataA
        })
    });

    // insert dataset B
    await fetch('/api/insert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            datasetName: "B",
            values: dataB
        })
    });

    alert("Data inserted!");

    // auto generate tree
    generate();
}

window.onload = () => {
    loadLogs();
};
</script>

</body>
</html>
